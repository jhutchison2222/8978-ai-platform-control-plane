name: Merge gates

on:
  workflow_run:
    workflows: [validate]
    types: [completed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  # Resolves the PR number, head sha, base sha, and the checkout/publish posture for every trigger
  # shape:
  #
  # needs_overlay — whether this run's default checkout can contain the PR's own proposed edits
  # (true for pull_request_review, which operates in the context of the PR's merge commit) versus
  # already being the trusted base/default branch content (workflow_run always runs in the context of
  # its own trigger event, which occurs on the base branch; issue_comment/workflow_dispatch likewise
  # check out the default branch by default). A PR CANNOT edit this workflow file's own steps and
  # have that edited version execute, specifically because none of these four trigger types read the
  # workflow DEFINITION from the PR's head: workflow_run and pull_request_review are both sourced from
  # the default branch for the workflow file itself (same as dispatch-pr-merge-gate.yml, which uses
  # this exact pull_request_review + workflow_run combination for the same reason — a plain
  # `pull_request` trigger was used here previously and was a real vulnerability, since GitHub reads a
  # pull_request-triggered workflow's own step definitions from the PR's own head: see the fixed
  # review thread on this PR for the citation). needs_overlay only protects the FILE CONTENTS checked
  # out at runtime (autonomy-supervisor.js and friends), which is a separate, narrower concern from
  # which workflow steps execute at all.
  #
  # publish_externally — whether this run's own pass/fail is invisible to the PR's required checks and
  # must be explicitly republished against the real head sha via the Checks API. workflow_run and
  # pull_request_review both correctly auto-attach to the originating PR (confirmed by this repo's own
  # "dispatch" check, driven by the identical trigger combination, showing up correctly scoped per PR
  # throughout this project's history) — publish_externally is false for both. issue_comment and
  # workflow_dispatch do not — github.sha resolves to the default branch tip for those two event
  # types, not the PR's head — so publish_externally is true for both.
  #
  # Known limitation, left as-is: GitHub Actions has no workflow trigger for "a review thread was
  # resolved" alone (pull_request_review_thread is a real webhook/GraphQL event but is not a
  # supported `on:` trigger — using it here previously made the whole workflow file unparseable, so
  # it was removed). Resolving the last actionable thread does not by itself re-run review-gate; a
  # new commit (which reruns validate, triggering workflow_run), a new review, a new issue comment,
  # or workflow_dispatch does.
  resolve-pr:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.pull_requests[0].number > 0) ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      needs_overlay: ${{ steps.resolve.outputs.needs_overlay }}
      publish_externally: ${{ steps.resolve.outputs.publish_externally }}
    steps:
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER_INPUT: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA_INPUT: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA_INPUT: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          WORKFLOW_RUN_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          ISSUE_NUMBER_INPUT: ${{ github.event.issue.number }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request_review)
              echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
              echo "head_sha=$PR_HEAD_SHA_INPUT" >> "$GITHUB_OUTPUT"
              echo "base_sha=$PR_BASE_SHA_INPUT" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=true" >> "$GITHUB_OUTPUT"
              echo "publish_externally=false" >> "$GITHUB_OUTPUT"
              ;;
            workflow_run)
              echo "pr_number=$WORKFLOW_RUN_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "head_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "base_sha=$WORKFLOW_RUN_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=false" >> "$GITHUB_OUTPUT"
              echo "publish_externally=false" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment|workflow_dispatch)
              number="${ISSUE_NUMBER_INPUT:-$WORKFLOW_DISPATCH_PR_NUMBER}"
              pr_json="$(gh api "repos/$REPOSITORY/pulls/$number")"
              echo "pr_number=$number" >> "$GITHUB_OUTPUT"
              echo "head_sha=$(echo "$pr_json" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
              echo "base_sha=$(echo "$pr_json" | jq -r .base.sha)" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=false" >> "$GITHUB_OUTPUT"
              echo "publish_externally=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected event: $EVENT_NAME"
              exit 1
              ;;
          esac

  security-gate:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # See resolve-pr's needs_overlay comment above for why only pull_request_review needs this.
      # Overwrites every SENSITIVE_AUTOMATION_PATHS file with its base-branch copy before evaluating,
      # so a PR editing scripts/autonomy-supervisor.js (or this gate's own files) cannot control its
      # own gate run. The protected-path list itself is read from the BASE branch's copy of
      # autonomy-supervisor.js, not the PR's, so a PR cannot shrink the list to exempt its own edits.
      # If no trusted gate exists on the base branch yet (scripts/security-gate.js absent there), this
      # is the one-time PR introducing the gate mechanism itself — there is nothing to fall back to, so
      # this PR's own code runs unmodified; protection begins with the next PR, once this one merges.
      - name: Protect gate logic against this PR's own proposed edits
        if: needs.resolve-pr.outputs.needs_overlay == 'true'
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/security-gate.js" 2>/dev/null; then
            mkdir -p /tmp/merge-gate-overlay
            git show "$BASE_SHA:scripts/autonomy-supervisor.js" > /tmp/merge-gate-overlay/base-autonomy-supervisor.mjs
            # A relative import from a wrapper file placed alongside it, not `node -e` with an
            # absolute specifier: autonomy-supervisor.js's own entry-point guard
            # (`if (import.meta.url === pathToFileURL(process.argv[1]).href)`) would otherwise compare
            # against an undefined argv[1] under `-e` and crash trying to run the full supervisor, and
            # a bare absolute-path import specifier is not portably valid across Node ESM resolvers.
            {
              echo 'import { SENSITIVE_AUTOMATION_PATHS } from "./base-autonomy-supervisor.mjs";'
              echo 'console.log(SENSITIVE_AUTOMATION_PATHS.join("\n"));'
            } > /tmp/merge-gate-overlay/print-sensitive-paths.mjs
            mapfile -t paths < <(node /tmp/merge-gate-overlay/print-sensitive-paths.mjs)
            for path in "${paths[@]}"; do
              if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
                git show "$BASE_SHA:$path" > "$path"
              fi
            done
          else
            echo "::notice::No trusted gate exists yet on the base branch; evaluating this PR's own gate code (bootstrap). Protection begins once this PR merges."
          fi
      - name: Evaluate security gate
        id: run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: node scripts/security-gate.js
      - name: Publish result against the pull request's head commit
        if: needs.resolve-pr.outputs.publish_externally == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="success"
          if [ "${{ steps.run.outcome }}" != "success" ]; then conclusion="failure"; fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f "name=security-gate" \
            -f "head_sha=${{ needs.resolve-pr.outputs.head_sha }}" \
            -f "status=completed" \
            -f "conclusion=$conclusion" > /dev/null
      - name: Fail if the gate failed
        if: steps.run.outcome != 'success'
        run: exit 1

  review-gate:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Same protection as security-gate — see its comment above and resolve-pr's needs_overlay
      # comment. review-gate's own decision logic only reads already-posted GitHub review/thread
      # state (nothing the PR author's local files can forge), but it imports from the same
      # autonomy-supervisor.js, so it is protected identically for consistency and because a future PR
      # could still try to weaken reviewGateDecision itself.
      - name: Protect gate logic against this PR's own proposed edits
        if: needs.resolve-pr.outputs.needs_overlay == 'true'
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/review-gate.js" 2>/dev/null; then
            mkdir -p /tmp/merge-gate-overlay
            git show "$BASE_SHA:scripts/autonomy-supervisor.js" > /tmp/merge-gate-overlay/base-autonomy-supervisor.mjs
            # A relative import from a wrapper file placed alongside it, not `node -e` with an
            # absolute specifier: autonomy-supervisor.js's own entry-point guard
            # (`if (import.meta.url === pathToFileURL(process.argv[1]).href)`) would otherwise compare
            # against an undefined argv[1] under `-e` and crash trying to run the full supervisor, and
            # a bare absolute-path import specifier is not portably valid across Node ESM resolvers.
            {
              echo 'import { SENSITIVE_AUTOMATION_PATHS } from "./base-autonomy-supervisor.mjs";'
              echo 'console.log(SENSITIVE_AUTOMATION_PATHS.join("\n"));'
            } > /tmp/merge-gate-overlay/print-sensitive-paths.mjs
            mapfile -t paths < <(node /tmp/merge-gate-overlay/print-sensitive-paths.mjs)
            for path in "${paths[@]}"; do
              if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
                git show "$BASE_SHA:$path" > "$path"
              fi
            done
          else
            echo "::notice::No trusted gate exists yet on the base branch; evaluating this PR's own gate code (bootstrap). Protection begins once this PR merges."
          fi
      - name: Evaluate review gate
        id: run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: node scripts/review-gate.js
      - name: Publish result against the pull request's head commit
        if: needs.resolve-pr.outputs.publish_externally == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="success"
          if [ "${{ steps.run.outcome }}" != "success" ]; then conclusion="failure"; fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f "name=review-gate" \
            -f "head_sha=${{ needs.resolve-pr.outputs.head_sha }}" \
            -f "status=completed" \
            -f "conclusion=$conclusion" > /dev/null
      - name: Fail if the gate failed
        if: steps.run.outcome != 'success'
        run: exit 1
