name: Merge gates

on:
  workflow_run:
    workflows: [validate, "Dispatch PR merge gate"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write

jobs:
  # TRIGGER SAFETY, read this before changing `on:` above: pull_request, pull_request_review, and
  # pull_request_review_comment all execute the workflow's own step DEFINITIONS from the pull
  # request's merge commit, not the base branch (this is the documented reason pull_request_target
  # exists at all). A prior version of this file used pull_request, then pull_request_review, both on
  # the mistaken assumption that only the FILE CONTENTS they check out (not the steps that execute)
  # come from the PR. A PR editing merge-gates.yml itself — deleting the overlay step, the "Fail if
  # the gate failed" step, or the whole job — would have had that edited version execute and get
  # reported as the result, regardless of any checkout-ref pinning or file overlay inside those now-
  # attacker-controlled steps. Only workflow_run and workflow_dispatch read the workflow DEFINITION
  # from the default branch (workflow_run always; workflow_dispatch's definition is pinned to
  # whichever ref the dispatch targets, but that ref is chosen by a trusted caller, never by the PR
  # being evaluated) — issue_comment is also safe here as a PURE data trigger (a comment cannot alter
  # which steps run). None of the four remaining trigger types in this file let a PR control its own
  # evaluation.
  #
  # workflow_run listens to BOTH validate (re-evaluates after every push/test completion) and
  # Dispatch PR merge gate (re-evaluates promptly after Claude review activity, since that workflow's
  # own trigger includes pull_request_review — an indirection that gets the fast reaction time of
  # reacting to a review without this file ever listening to pull_request_review directly). Dispatch
  # PR merge gate's own output is never treated as evidence of anything: it merely wakes this
  # workflow, which independently re-fetches reviews, the PR's current head, and review threads from
  # GitHub and applies reviewGateDecision() itself — even a compromised Dispatch PR merge gate run
  # cannot forge a genuine claude[bot] exact-head review, since this workflow never reads anything
  # from that run's own output or logs.
  #
  # Resolves the PR number, head sha, base sha, and the checkout/publish posture for every trigger
  # shape:
  #
  # needs_overlay — whether this run's default checkout can contain content the evaluated PR itself
  # controls. workflow_run always executes in the context of its own trigger (the base branch) and
  # issue_comment likewise checks out the default branch by default — both false. workflow_dispatch
  # lets the CALLER choose any ref to run against; if that ref happens to be the PR's own branch (or
  # any other attacker-influenced branch), default checkout would contain unprotected gate files —
  # true, so the overlay below always runs for it regardless of which ref was actually chosen.
  #
  # publish_externally — whether this run's own pass/fail is invisible to the PR's required checks and
  # must be explicitly republished against the real head sha via the Checks API. Confirmed empirically
  # (not assumed): neither workflow_run nor issue_comment auto-attach their check conclusion to the
  # originating PR's head commit — `gh api .../check-runs` on this PR's own head showed the "dispatch"
  # check-run (from dispatch-pr-merge-gate.yml) was present only from its pull_request_review-triggered
  # runs; its workflow_run-triggered runs' own associated commit was main's tip, not this PR's head, and
  # produced no check-run on this PR at all. So publish_externally is true for all three remaining
  # trigger types here, unconditionally.
  #
  # Known limitation, left as-is: GitHub Actions has no workflow trigger for "a review thread was
  # resolved" alone (pull_request_review_thread is a real webhook/GraphQL event but is not a
  # supported `on:` trigger — using it here previously made the whole workflow file unparseable, so
  # it was removed). Resolving the last actionable thread does not by itself re-run review-gate; a
  # new commit (reruns validate), a new review (reruns Dispatch PR merge gate), a new issue comment,
  # or workflow_dispatch does.
  #
  # Known limitation, left as-is: GitHub leaves github.event.workflow_run.pull_requests empty for a
  # pull request from a forked repository (the same documented behavior dispatch-pr-merge-gate.yml
  # already relies on unprotected, at its own identical `pull_requests[0].number > 0` check). A fork
  # PR's ordinary push therefore never resolves a PR number here and never gets a security-gate/
  # review-gate result on its own — only issue_comment (an owner/maintainer commenting) or an explicit
  # workflow_dispatch does. This repository has no history of fork contributions and this gate's
  # purpose is to protect merges, not to review fork PRs in general, so a maintainer reviewing a fork
  # PR manually (as the existing supervisor dispatch flow's own restrictedForkPullRequest handling
  # already assumes) is an acceptable, pre-existing boundary, not something this PR introduces.
  resolve-pr:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number > 0) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      needs_overlay: ${{ steps.resolve.outputs.needs_overlay }}
      publish_externally: ${{ steps.resolve.outputs.publish_externally }}
    steps:
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          WORKFLOW_RUN_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          ISSUE_NUMBER_INPUT: ${{ github.event.issue.number }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_run)
              echo "pr_number=$WORKFLOW_RUN_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "head_sha=$WORKFLOW_RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "base_sha=$WORKFLOW_RUN_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=false" >> "$GITHUB_OUTPUT"
              echo "publish_externally=true" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment)
              pr_json="$(gh api "repos/$REPOSITORY/pulls/$ISSUE_NUMBER_INPUT")"
              echo "pr_number=$ISSUE_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
              echo "head_sha=$(echo "$pr_json" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
              echo "base_sha=$(echo "$pr_json" | jq -r .base.sha)" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=false" >> "$GITHUB_OUTPUT"
              echo "publish_externally=true" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              # workflow_dispatch lets the caller choose ANY ref to run this workflow against — the
              # default checkout below would then check out that caller-chosen ref, not necessarily
              # anything trusted. needs_overlay=true forces the protected-path overlay, so the gate
              # scripts that actually execute are always the base-branch's trusted copies regardless
              # of which ref was dispatched against, and the PR they evaluate is always resolved
              # fresh via the API (pr_json below), never from local files.
              pr_json="$(gh api "repos/$REPOSITORY/pulls/$WORKFLOW_DISPATCH_PR_NUMBER")"
              echo "pr_number=$WORKFLOW_DISPATCH_PR_NUMBER" >> "$GITHUB_OUTPUT"
              echo "head_sha=$(echo "$pr_json" | jq -r .head.sha)" >> "$GITHUB_OUTPUT"
              echo "base_sha=$(echo "$pr_json" | jq -r .base.sha)" >> "$GITHUB_OUTPUT"
              echo "needs_overlay=true" >> "$GITHUB_OUTPUT"
              echo "publish_externally=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected event: $EVENT_NAME"
              exit 1
              ;;
          esac

  security-gate:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # See resolve-pr's needs_overlay comment above for why only workflow_dispatch needs this today.
      # Overwrites every SENSITIVE_AUTOMATION_PATHS file with its base-branch copy before evaluating,
      # so a run dispatched against an untrusted ref (or, if a future trigger ever checks out PR
      # content again, a PR editing scripts/autonomy-supervisor.js or this gate's own files) cannot
      # control its own gate run. The protected-path list itself is read from the BASE branch's copy
      # of autonomy-supervisor.js, not the checked-out one, so it cannot be shrunk to exempt anything.
      # If no trusted gate exists on the base branch yet (scripts/security-gate.js absent there), this
      # is the one-time PR introducing the gate mechanism itself — there is nothing to fall back to, so
      # this PR's own code runs unmodified; protection begins with the next PR, once this one merges.
      - name: Protect gate logic against an untrusted checked-out ref
        if: needs.resolve-pr.outputs.needs_overlay == 'true'
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/security-gate.js" 2>/dev/null; then
            mkdir -p /tmp/merge-gate-overlay
            git show "$BASE_SHA:scripts/autonomy-supervisor.js" > /tmp/merge-gate-overlay/base-autonomy-supervisor.mjs
            # A relative import from a wrapper file placed alongside it, not `node -e` with an
            # absolute specifier: autonomy-supervisor.js's own entry-point guard
            # (`if (import.meta.url === pathToFileURL(process.argv[1]).href)`) would otherwise compare
            # against an undefined argv[1] under `-e` and crash trying to run the full supervisor, and
            # a bare absolute-path import specifier is not portably valid across Node ESM resolvers.
            {
              echo 'import { SENSITIVE_AUTOMATION_PATHS } from "./base-autonomy-supervisor.mjs";'
              echo 'console.log(SENSITIVE_AUTOMATION_PATHS.join("\n"));'
            } > /tmp/merge-gate-overlay/print-sensitive-paths.mjs
            # A plain redirect into a file, not `mapfile < <(...)`: bash's `set -e` does not see a
            # process substitution's exit status, only mapfile's own, so a crashing node helper would
            # otherwise leave `paths` silently empty and this step would exit 0 — disabling the entire
            # tamper-protection overlay without any error. Redirecting to a real file makes node's own
            # exit code the one `set -e` observes, failing the step loudly instead.
            node /tmp/merge-gate-overlay/print-sensitive-paths.mjs > /tmp/merge-gate-overlay/sensitive-paths.txt
            mapfile -t paths < /tmp/merge-gate-overlay/sensitive-paths.txt
            for path in "${paths[@]}"; do
              if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
                git show "$BASE_SHA:$path" > "$path"
              fi
            done
          else
            echo "::notice::No trusted gate exists yet on the base branch; evaluating this PR's own gate code (bootstrap). Protection begins once this PR merges."
          fi
      - name: Evaluate security gate
        id: run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: node scripts/security-gate.js
      - name: Publish result against the pull request's head commit
        if: needs.resolve-pr.outputs.publish_externally == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="success"
          if [ "${{ steps.run.outcome }}" != "success" ]; then conclusion="failure"; fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f "name=security-gate" \
            -f "head_sha=${{ needs.resolve-pr.outputs.head_sha }}" \
            -f "status=completed" \
            -f "conclusion=$conclusion" > /dev/null
      - name: Fail if the gate failed
        if: steps.run.outcome != 'success'
        run: exit 1

  review-gate:
    needs: resolve-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Same protection as security-gate — see its comment above and resolve-pr's needs_overlay
      # comment. review-gate's own decision logic only reads already-posted GitHub review/thread
      # state (nothing a checked-out file can forge), but it imports from the same
      # autonomy-supervisor.js, so it is protected identically for consistency and because a future
      # trigger could still expose it to an untrusted checkout.
      - name: Protect gate logic against an untrusted checked-out ref
        if: needs.resolve-pr.outputs.needs_overlay == 'true'
        env:
          BASE_SHA: ${{ needs.resolve-pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/review-gate.js" 2>/dev/null; then
            mkdir -p /tmp/merge-gate-overlay
            git show "$BASE_SHA:scripts/autonomy-supervisor.js" > /tmp/merge-gate-overlay/base-autonomy-supervisor.mjs
            # A relative import from a wrapper file placed alongside it, not `node -e` with an
            # absolute specifier: autonomy-supervisor.js's own entry-point guard
            # (`if (import.meta.url === pathToFileURL(process.argv[1]).href)`) would otherwise compare
            # against an undefined argv[1] under `-e` and crash trying to run the full supervisor, and
            # a bare absolute-path import specifier is not portably valid across Node ESM resolvers.
            {
              echo 'import { SENSITIVE_AUTOMATION_PATHS } from "./base-autonomy-supervisor.mjs";'
              echo 'console.log(SENSITIVE_AUTOMATION_PATHS.join("\n"));'
            } > /tmp/merge-gate-overlay/print-sensitive-paths.mjs
            # A plain redirect into a file, not `mapfile < <(...)`: bash's `set -e` does not see a
            # process substitution's exit status, only mapfile's own, so a crashing node helper would
            # otherwise leave `paths` silently empty and this step would exit 0 — disabling the entire
            # tamper-protection overlay without any error. Redirecting to a real file makes node's own
            # exit code the one `set -e` observes, failing the step loudly instead.
            node /tmp/merge-gate-overlay/print-sensitive-paths.mjs > /tmp/merge-gate-overlay/sensitive-paths.txt
            mapfile -t paths < /tmp/merge-gate-overlay/sensitive-paths.txt
            for path in "${paths[@]}"; do
              if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
                git show "$BASE_SHA:$path" > "$path"
              fi
            done
          else
            echo "::notice::No trusted gate exists yet on the base branch; evaluating this PR's own gate code (bootstrap). Protection begins once this PR merges."
          fi
      - name: Evaluate review gate
        id: run
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: node scripts/review-gate.js
      - name: Publish result against the pull request's head commit
        if: needs.resolve-pr.outputs.publish_externally == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="success"
          if [ "${{ steps.run.outcome }}" != "success" ]; then conclusion="failure"; fi
          gh api --method POST "repos/${{ github.repository }}/check-runs" \
            -f "name=review-gate" \
            -f "head_sha=${{ needs.resolve-pr.outputs.head_sha }}" \
            -f "status=completed" \
            -f "conclusion=$conclusion" > /dev/null
      - name: Fail if the gate failed
        if: steps.run.outcome != 'success'
        run: exit 1
