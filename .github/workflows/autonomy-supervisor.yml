name: Autonomous supervisor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["validate"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled, reopened]

concurrency:
  group: autonomy-supervisor
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Supervise pull requests and queued tasks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_ID: ${{ vars.CHATGPT_WORKSPACE_AGENT_ID }}
          AGENT_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TOKEN }}
        run: node scripts/autonomy-supervisor.js
