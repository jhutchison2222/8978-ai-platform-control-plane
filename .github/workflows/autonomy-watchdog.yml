name: Autonomous security watchdog

on:
  schedule:
    - cron: "0-59/5 * * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, closed]
  issues:
    types: [labeled, unlabeled, closed, reopened]

concurrency:
  group: autonomy-control
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Enforce autonomous dispatch boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/autonomy-watchdog.js
